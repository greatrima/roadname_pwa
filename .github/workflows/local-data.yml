name: Monthly local address data
# The newest month of the public road address data, once it is out: built per 시·군·구, published as a
# local-YYYYMM release, and the site redeployed so phones take it. Most days nothing is out yet and nothing happens.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'YYYYMM to build (blank: the month after the newest release)'
        required: false
      dry:
        description: 'Only download and build (no release)'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: local-data
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and publish the newest month
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/local-update.py ${{ inputs.month }} ${{ inputs.dry && '--dry' || '' }}
